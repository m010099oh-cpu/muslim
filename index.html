<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صحيح مسلم | الموسوعة الإسلامية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mainNavBar">
        <a href="https://m010099oh-cpu.github.io/mainpage/">الرئيسية</a>
        <a href="https://m010099oh-cpu.github.io/Holy-Quran/">استماع قران</a>
        <a href="https://m010099oh-cpu.github.io/bukhari/">صحيح البخاري</a>
        <a href="https://m010099oh-cpu.github.io/muslim/">صحيح مسلم</a>
        <a href="https://m010099oh-cpu.github.io/prophets/">قصص الأنبياء</a>
        <h1>صحيح مسلم</h1>
    </div>
    <div class="navBar">
        <input type="text" placeholder="ابحث في أحاديث صحيح مسلم" aria-label="ابحث في أحاديث صحيح مسلم">
        <button type="button">بحث</button>
    </div>

    <div class="content">
        <ul>
        </ul>
    </div>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Almarai", sans-serif;
        }

        body {
            min-height: 100vh;
            color: #f8f5ec;
            background:
                linear-gradient(180deg, rgba(3, 12, 9, 0.86), rgba(7, 30, 20, 0.92)),
                url("https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1600&q=80") center/cover fixed;
        }

        .mainNavBar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 18px clamp(16px, 4vw, 42px);
            border-bottom: 1px solid rgba(255, 215, 120, 0.35);
            background: linear-gradient(180deg, rgba(13, 46, 27, 0.97), rgba(8, 35, 21, 0.98));
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
        }

        .mainNavBar a {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            padding: 8px 13px;
            border: 1px solid rgba(255, 215, 120, 0.28);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            color: #f5e9c8;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .mainNavBar a:hover {
            background: rgba(255, 215, 120, 0.12);
            border-color: rgba(255, 215, 120, 0.6);
        }

        .mainNavBar h1 {
            flex: 1 1 100%;
            color: #f6d977;
            font-size: clamp(26px, 4vw, 40px);
            line-height: 1.4;
            text-align: center;
        }

        .navBar {
            display: flex;
            gap: 10px;
            width: min(900px, calc(100% - 32px));
            margin: 22px auto;
            padding: 14px;
            border: 1px solid rgba(255, 215, 120, 0.25);
            border-radius: 20px;
            background: rgba(12, 43, 27, 0.9);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
        }

        .navBar input {
            flex: 1;
            min-width: 0;
            min-height: 50px;
            padding: 0 16px;
            border: 1px solid rgba(255, 215, 120, 0.42);
            border-radius: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 16px;
            text-align: right;
        }

        .navBar input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .navBar input:focus {
            border-color: #f6d977;
            box-shadow: 0 0 0 3px rgba(246, 217, 119, 0.12);
        }

        .navBar button {
            min-width: 100px;
            min-height: 50px;
            padding: 0 20px;
            border: 1px solid rgba(255, 215, 120, 0.55);
            border-radius: 14px;
            background: linear-gradient(135deg, #f0d185, #c9922f);
            color: #122d1f;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .navBar button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(192, 145, 58, 0.28);
        }

        .content {
            width: min(1100px, calc(100% - 32px));
            min-height: 120px;
            margin: 0 auto 32px;
            padding: 18px;
            border: 1px solid rgba(255, 215, 120, 0.22);
            border-radius: 20px;
            background: rgba(8, 31, 20, 0.74);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.2);
        }

        .content ul {
            display: flex;
            flex-direction: column;
            gap: 14px;
            list-style: none;
        }

        .content li {
            padding: 18px;
            border: 1px solid rgba(255, 215, 120, 0.22);
            border-right: 4px solid #c9922f;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            color: #f5efe5;
            line-height: 2;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .content li h3 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 54px;
            min-height: 42px;
            margin-bottom: 12px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 215, 120, 0.45);
            border-radius: 12px;
            background: rgba(214, 176, 98, 0.14);
            color: #f6d977;
            font-size: 17px;
        }

        .content li p {
            font-size: 18px;
            line-height: 2.1;
        }

        @media (max-width: 600px) {
            .mainNavBar {
                gap: 7px;
                padding: 14px 12px;
            }

            .mainNavBar a {
                flex: 1 1 calc(50% - 7px);
                justify-content: center;
                min-height: 40px;
                padding: 7px 8px;
                font-size: 12px;
                text-align: center;
            }

            .mainNavBar h1 {
                order: -1;
                font-size: 25px;
            }

            .navBar {
                gap: 8px;
                width: calc(100% - 24px);
                margin: 14px auto;
                padding: 10px;
                border-radius: 16px;
            }

            .navBar input {
                min-height: 46px;
                padding: 0 11px;
                font-size: 14px;
            }

            .navBar button {
                min-width: 72px;
                min-height: 46px;
                padding: 0 12px;
                font-size: 15px;
            }

            .content {
                width: calc(100% - 24px);
                margin-bottom: 20px;
                padding: 10px;
                border-radius: 16px;
            }

            .content ul {
                gap: 10px;
            }

            .content li {
                padding: 14px;
                border-radius: 13px;
            }

            .content li p {
                font-size: 16px;
                line-height: 2;
            }
        }
    </style>

    <script>
       
        document.querySelector("button").onclick = function(){
            document.querySelector(".content ul").innerHTML = ""
            document.querySelector(".content").style.display = "block"
            fetch("https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-muslim.min.json").then(res => res.json()).then(data => {
                for(let i = 0; i < data.hadiths.length;i++){
                    //console.log(data.hadiths[i].text)
                    if(data.hadiths[i].text.normalize("NFD")
        // 2. إزالة علامات التشكيل (الحركات)
        .replace(/[\u0300-\u036f]/g, "")
        // 3. توحيد الهمزات والألف المقصورة والتاء المربوطة
        .replace(/[أإآأ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        // 4. إزالة الشدة وعلامات التشكيل القرآنية/العربية الإضافية إن وجدت
        .replace(/[\u064B-\u065F]/g, "").includes(document.querySelector("input").value)){
                        console.log(data.hadiths[i])
                         let li = document.createElement("li")
                         li.innerHTML = `
                         <h3>${data.hadiths[i].hadithnumber}</h3>
                         <p>${data.hadiths[i].text}</p>
                         `
                         document.querySelector(".content ul").appendChild(li)
                    }else{
                        console.log("no")
                    }
                }
            })
        }

    </script>
</body>
</html>
