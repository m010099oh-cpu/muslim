<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mainNavBar">
        <a href="https://m010099oh-cpu.github.io/mainpage/">الرئيسية</a>
        <a href="https://m010099oh-cpu.github.io/Holy-Quran/">استماع قران</a>
        <a href="https://m010099oh-cpu.github.io/bukhari/">صحيح البخاري</a>
        <a href="https://m010099oh-cpu.github.io/muslim/">صحيح مسلم</a>
        <a href="https://m010099oh-cpu.github.io/prophets/">قصص الأنبياء</a>
        <h1>صحيح مسلم</h1>
    </div>
    <div class="navBar">
        <input type="text">
        <button>بحث</button>
    </div>

    <div class="content">
        <ul>
        </ul>
    </div>

    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: "Almarai", sans-serif;
        }
        h1{color: aliceblue;width: 70%;display: flex;justify-content: flex-end;}
        body{
            width: 100%;
            height: 100vh;
            background-image: url(./—Pngtree—islamic\ background\ with\ mandala\ motif_1965455.png);
            background-size: 100%;
            background-repeat: no-repeat;
        }
        a{
            text-decoration: none;
            color: rgb(255, 255, 255);
            margin-left: 10px;
        }
        .mainNavBar{
            background-color: rgb(4, 4, 4);
            width: 100%;
            height: 10%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navBar{
            width: 100%;
            height: 15%;
            padding: 5px 0px;
            background-color: black;
        }
        button{
            background-image: linear-gradient(to right, gold, yellow 60%, rgb(222, 222, 4));
            border: none;
            outline: none;
            border-radius: 5px;
            color: black;
            padding: 10px 20px 10px 20px;
            width: 20%;
            font-size: 20px;
            text-align: center;
        }
        li{
            font-size: 30px;
        }
        input{
            width: 75%;
            height: 90%;
            border-radius: 5px;
            background-color: #fefcf3 !important;
            color: rgb(2, 2, 2);
            border: none;
            margin-left: 5px;
        }
        .content{
            width: 99.2%;
            height: 75%;
            padding: 5px 5px 15px 5px;
            color: white;
            overflow: scroll;
            scrollbar-width: none;
            background-image: url(./—Pngtree—islamic\ background\ with\ mandala\ motif_1965455.png);
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }
        ul{
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        li{
            width: 95%;
            line-height: 60px;
            padding: 5px;
            background-color: rgb(255, 238, 216);
            border-radius: 5px;
            border-right: green solid 10px;
            color: black;
            direction: rtl;
            list-style: none;
        }
        li h3 {
            background-color: rgba(47, 255, 134, 0.677);
            width: fit-content;
            height: fit-content;
            padding: 5px 30px;
            border-radius: 20px;
        }
        @media (min-width: 0px) and (max-width: 600px){
            a {
                font-size: 10px;
            }
            h1 {
                font-size: 15px;
            }
            button {
                font-size: 10px;
                font-weight: bold;
                padding: none;
            }
        }
    </style>

    <script>
       
        document.querySelector("button").onclick = function(){
            document.querySelector(".content ul").innerHTML = ""
            document.querySelector(".content").style.display = "block"
            fetch("https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-muslim.min.json").then(res => res.json()).then(data => {
                for(let i = 0; i < data.hadiths.length;i++){
                    //console.log(data.hadiths[i].text)
                    if(data.hadiths[i].text.normalize("NFD")
        // 2. إزالة علامات التشكيل (الحركات)
        .replace(/[\u0300-\u036f]/g, "")
        // 3. توحيد الهمزات والألف المقصورة والتاء المربوطة
        .replace(/[أإآأ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        // 4. إزالة الشدة وعلامات التشكيل القرآنية/العربية الإضافية إن وجدت
        .replace(/[\u064B-\u065F]/g, "").includes(document.querySelector("input").value)){
                        console.log(data.hadiths[i])
                         let li = document.createElement("li")
                         li.innerHTML = `
                         <h3>${data.hadiths[i].hadithnumber}</h3>
                         <p>${data.hadiths[i].text}</p>
                         `
                         document.querySelector(".content ul").appendChild(li)
                    }else{
                        console.log("no")
                    }
                }
            })
        }

    </script>
</body>
</html>
